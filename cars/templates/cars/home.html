{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ company_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #1a1200; color: white; scroll-behavior: smooth; }

        /* NAVBAR */
        nav { background: #2d1f00; display: flex; justify-content: space-between; align-items: center; padding: 15px 60px; position: fixed; width: 100%; top: 0; z-index: 1000; }
        nav .logo { font-weight: bold; font-size: 18px; color: #d4af37; display: flex; align-items: center; gap: 10px; }
        nav .logo img { height: 30px; width: auto; border-radius: 4px; } /* ONLY CHANGE HERE */
        nav ul { list-style: none; display: flex; gap: 25px; }
        nav ul li a { color: #f5f5dc; text-decoration: none; font-size: 14px; }
        nav ul li a:hover { color: #d4af37; }
        nav .phone { background: #f5f5dc; color: #2d1f00; padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 5px; }

        /* HERO SECTION */
        .hero { display: flex; align-items: center; justify-content: space-between; padding: 120px 60px 60px; background: linear-gradient(135deg, #1a1200 60%, #3a2e00 100%); clip-path: polygon(0 0, 100% 0, 100% 90%, 0% 100%); }
        .hero-text { max-width: 50%; }
        .hero-text .welcome { color: #d4af37; font-size: 13px; margin-bottom: 10px; letter-spacing: 1px; }
        .hero-text h1 { font-size: 38px; line-height: 1.2; margin-bottom: 15px; }
        .hero-text p { color: #ccc; font-size: 14px; margin-bottom: 25px; }
        .btn-group { display: flex; gap: 15px; }
        .btn { padding: 12px 25px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .btn-gold { background: #d4af37; color: #1a1200; }
        .btn-gold:hover { background: #c49b2e; transform: translateY(-2px); }
        .btn-white { background: white; color: #1a1200; }
        .btn-white:hover { background: #eee; transform: translateY(-2px); }
        
        /* LOGO IN HERO - ONLY SIZE CHANGED */
        .hero-img { flex: 1; text-align: center; }
        .hero-img img { 
            width: 180px; /* ONLY CHANGE HERE - was 400px */
            max-width: 100%; 
            filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.4));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }

        /* REST OF YOUR CSS UNTOUCHED */
        .banner { background: #f5f5dc; color: #2d1f00; text-align: center; padding: 15px; font-size: 12px; font-weight: 600; margin: -40px 60px 0; border-radius: 10px; }
        section { padding: 80px 60px; }
        h2 { text-align: center; color: #d4af37; margin-bottom: 40px; font-size: 28px; }
        .car-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .car-card { background: #2d1f00; border-radius: 12px; overflow: hidden; border: 1px solid #444; transition: transform 0.3s; }
        .car-card:hover { transform: translateY(-5px); }
        .car-card img { width: 100%; height: 200px; object-fit: cover; }
        .car-info { padding: 20px; }
        .book-btn { background: #d4af37; color: #1a1200; padding: 10px; display: block; text-align: center; text-decoration: none; border-radius: 5px; margin-top: 10px; font-weight: bold; }
        .book-btn:hover { background: #c49b2e; }
        .services { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .service-card { background: #2d1f00; padding: 25px; border-radius: 10px; border-left: 4px solid #d4af37; }
        .contact { background: #2d1f00; text-align: center; }
        footer { background: #100a00; text-align: center; padding: 20px; color: #aaa; }
        @media(max-width: 900px){
            .hero { flex-direction: column; text-align: center; }
            .hero-text { max-width: 100%; }
        }
    </style>
</head>
