<!DOCTYPE html>
<html>
<head>
    <title>Book {{ car.name }} - SN TRANSPORT</title>
    <style>
        body { background: #1a1200; color: white; font-family: 'Segoe UI', sans-serif; padding: 100px 20px; }
        
        /* CHANGED TO WHITE */
        .form-box { 
            background: #ffffff; /* WHITE NOW */
            color: #1a1200; /* dark text for white bg */
            max-width: 500px; 
            margin: auto; 
            padding: 40px; 
            border-radius: 12px; 
            border: 1px solid #d4af37; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        h1 { color: #d4af37; text-align: center; margin-bottom: 20px; }
        .form-box p { text-align:center; margin-bottom:20px; color: #1a1200; font-weight: 600; }
        
        label { display: block; margin-top: 15px; font-size: 14px; font-weight: 600; color: #1a1200; }
        
        input, textarea, select { 
            width: 100%; 
            padding: 12px; 
            margin-top: 5px; 
            background: #f5f5f5; /* light gray inputs */
            color: #1a1200; /* dark text */
            border: 1px solid #ccc; 
            border-radius: 5px; 
            font-size: 14px;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }
        
        button { 
            background: #d4af37; 
            color: #1a1200; 
            padding: 14px; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold; 
            width: 100%; 
            margin-top: 20px; 
            cursor: pointer; 
            font-size: 16px; 
        }
        button:hover { background: #c49b2e; }
        
        .back { display: block; text-align: center; margin-top: 15px; color: #d4af37; text-decoration: none; font-weight: 600; }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="form-box">
        <h1>Book {{ car.brand }} {{ car.name }}</h1>
        <p>{{ car.price_per_day }} RWF / day</p>
        
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Confirm Booking</button>
        </form>
        <a href="{% url 'home' %}" class="back">← Back to Cars</a>
    </div>
</body>
</html>
